name: Shell lifecycle
on: [push, pull_request]
permissions:
  contents: read
# Serialize main runs, including their checks, without replacing pending pushes.
concurrency:
  group: checks-${{ github.ref == 'refs/heads/main' && 'production' || github.run_id }}
  queue: max
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: for file in .agents/* .agents/tests/*.sh; do test -f "$file" || continue; bash -n "$file"; done
      - run: bash .agents/tests/lifecycle.sh
      - run: bash .agents/tests/configure-amp.sh
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: bash .agents/project setup
      - name: Check DESIGN.md and that the code uses its tokens only
        run: npm run lint
      - name: Build the site for Cloudflare
        run: npm run build
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lifecycle, application]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://learn-sql.lelouvincx.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
